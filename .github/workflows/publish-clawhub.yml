name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v
        required: true
        type: string
      changelog:
        description: Optional changelog for a manual publication
        required: false
        default: Manual ClawHub publication.
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
        shell: bash
        run: |
          version="${RELEASE_TAG:-$INPUT_VERSION}"
          version="${version#v}"
          changelog="${RELEASE_BODY:-$INPUT_CHANGELOG}"
          if [[ -z "$version" ]]; then
            echo "A release tag or manual version is required." >&2
            exit 1
          fi
          if [[ -z "$changelog" ]]; then
            changelog="Publish human-writing-skills v$version."
          fi
          {
            echo "version=$version"
            echo "changelog<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish skill
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANGELOG: ${{ steps.release.outputs.changelog }}
        run: |
          set -u
          skill="human-writing-skills"
          cli=(npx --yes clawhub@0.23.3 --no-input)

          npx --yes clawhub@0.23.3 login --token "$CLAWHUB_TOKEN"

          if "${cli[@]}" inspect "$skill" --version "$VERSION" --json >/dev/null 2>&1; then
            "${cli[@]}" skill tag "$skill" "$VERSION" --tag latest --yes
            echo "ClawHub version $VERSION already exists; latest now points to it."
            exit 0
          fi

          set +e
          publish_output=$("${cli[@]}" skill publish . \
            --slug "$skill" \
            --name "Advanced Human Writing Skills" \
            --owner whh110112 \
            --version "$VERSION" \
            --changelog "$CHANGELOG" \
            --tags latest \
            --categories creative,communication,development \
            --topics humanizer,writing,editing,chinese-writing,long-form-writing \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF_NAME" 2>&1)
          publish_status=$?
          set -e
          printf '%s\n' "$publish_output"

          if [[ $publish_status -eq 0 ]]; then
            exit 0
          fi
          if [[ "$publish_output" != *"already exists"* ]]; then
            exit "$publish_status"
          fi

          # ClawHub may create the version successfully, then return a duplicate-version
          # error during an internal retry before the public read API becomes consistent.
          for attempt in {1..8}; do
            if "${cli[@]}" inspect "$skill" --version "$VERSION" --json >/dev/null 2>&1; then
              "${cli[@]}" skill tag "$skill" "$VERSION" --tag latest --yes
              echo "Verified ClawHub version $VERSION after an eventually consistent publish."
              exit 0
            fi
            sleep 15
          done

          echo "ClawHub reported a duplicate version, but $VERSION never became readable." >&2
          exit "$publish_status"
