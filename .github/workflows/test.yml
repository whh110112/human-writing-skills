name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - shell: bash
        run: python -m pip install dist/*.whl
      - name: Smoke test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          human-writing-skills list --kind module
          python -I -c "from humanwriting.compiler import compile_prompt; assert 'scene' in compile_prompt(style='fiction', task='Write a scene.').lower()"
