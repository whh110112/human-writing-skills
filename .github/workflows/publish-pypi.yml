name: Build Python Distribution

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/publish-pypi.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish to PyPI after build (requires configured Trusted Publishing)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip build
      - name: Validate core release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release_version.py "$RELEASE_TAG"
      - run: python -m unittest discover -s tests -q
      - run: python -m build
      - name: Publish the versioned core GitHub Release
        id: core_release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python -c "from pathlib import Path; from scripts.build_skillhub_package import project_version; print(project_version(Path('.')))")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its versioned assets."
          else
            notes=(--generate-notes)
            if [ -f "docs/releases/${version}.md" ]; then
              notes=(--notes-file "docs/releases/${version}.md")
            fi
            gh release create "$tag" dist/*.whl dist/*.tar.gz \
              --target "$GITHUB_SHA" --latest \
              --title "Human Writing Skills $version" \
              "${notes[@]}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch marketplace publication for the immutable core tag
        if: github.event_name != 'release' && steps.core_release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python -c "from pathlib import Path; from scripts.build_skillhub_package import project_version; print(project_version(Path('.')))")
          # GITHUB_TOKEN-created releases do not trigger release workflows.
          # Explicit dispatch uses the tag so both marketplaces publish the same sources.
          gh workflow run publish-clawhub.yml --ref "v$version" -f "version=$version" \
            -f "changelog=Publish human-writing-skills v$version. See the GitHub Release for details."
          gh workflow run publish-skillhub.yml --ref "v$version" -f "version=$version" \
            -f "changelog=更新 human-writing-skills v$version；变更详情见 GitHub Release。"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/
      - name: Attach wheel and source distribution to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          for asset in dist/*.whl dist/*.tar.gz; do
            name=$(basename "$asset")
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Preserving existing asset: $name"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    if: >-
      (github.event_name == 'release' && vars.PYPI_PUBLISH_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    environment:
      name: pypi
      url: https://pypi.org/p/human-writing-skills
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
