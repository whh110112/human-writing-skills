name: Build Python Distribution

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/publish-pypi.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish to PyPI after build (requires configured Trusted Publishing)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip build
      - run: python -m unittest discover -s tests -q
      - run: python -m build
      - name: Publish the versioned core GitHub Release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python -c "from pathlib import Path; from scripts.build_skillhub_package import project_version; print(project_version(Path('.')))")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its versioned assets."
          else
            notes=(--generate-notes)
            if [ -f "docs/releases/${version}.md" ]; then
              notes=(--notes-file "docs/releases/${version}.md")
            fi
            gh release create "$tag" dist/*.whl dist/*.tar.gz \
              --target "$GITHUB_SHA" --latest \
              --title "Human Writing Skills $version" \
              "${notes[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/
      - name: Attach wheel and source distribution to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    if: >-
      (github.event_name == 'release' && vars.PYPI_PUBLISH_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    environment:
      name: pypi
      url: https://pypi.org/p/human-writing-skills
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
