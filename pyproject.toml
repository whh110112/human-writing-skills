[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-writing-skills"
version = "0.9.1"
description = "Advanced multilingual human-writing and AI-tone editing toolkit with natural scene transitions, long-form continuity, and semantic fidelity."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Advanced Human Writing Skills contributors" }]
keywords = ["writing", "humanizer", "text-humanizer", "ai-writing", "multilingual-writing", "long-context", "proofreading", "prompting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]

[project.scripts]
human-writing-skills = "humanwriting.cli:main"

[tool.setuptools]
packages = ["humanwriting", "humanwriting_skill_data"]

[tool.setuptools.package-dir]
humanwriting_skill_data = "skills"

[tool.setuptools.package-data]
humanwriting_skill_data = ["*.md"]
