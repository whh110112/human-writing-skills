[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-writing-skills"
version = "0.10.3"
description = "Advanced multilingual AI humanizer and writing toolkit with natural prose, long-form continuity, voice preservation, and semantic fidelity."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Advanced Human Writing & AI Humanizer contributors" }]
keywords = ["writing", "humanizer", "ai-humanizer", "text-humanizer", "de-ai-writing", "ai-writing-tool", "natural-writing", "fiction-editing", "novel-writing", "multilingual-writing", "story-continuity", "proofreading", "prompting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]

[project.scripts]
human-writing-skills = "humanwriting.cli:main"

[tool.setuptools]
packages = ["humanwriting", "humanwriting_skill_data"]

[tool.setuptools.package-dir]
humanwriting_skill_data = "skills"

[tool.setuptools.package-data]
humanwriting_skill_data = ["*.md"]
